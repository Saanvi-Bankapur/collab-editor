# Round-robin load balancer in front of the 3 app instances (docker compose --profile full).
# No sticky sessions needed: any instance can serve any document, Redis pub/sub keeps them in sync.
upstream coedit {
    server app1:4000;
    server app2:4000;
    server app3:4000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    client_max_body_size 10m; # image uploads (MAX_UPLOAD_MB defaults to 5)

    location / {
        proxy_pass http://coedit;
        proxy_http_version 1.1;
        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # Shows which instance answered (handy for the scaling demo)
        add_header X-Upstream $upstream_addr always;
    }
}
